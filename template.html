<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.7;
      color: #2d3748;
      background-color: #f7fafc;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      padding: 3rem 0 2rem;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 2rem;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.05rem;
      color: #4a5568;
      max-width: 650px;
      margin: 0 auto;
    }

    header a {
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
    }

    header a:hover {
      text-decoration: underline;
    }

    section {
      margin-bottom: 2.5rem;
    }

    section > h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
      border-bottom: 2px solid #3182ce;
      padding-bottom: 0.4rem;
      margin-bottom: 1.2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 0.2rem;
    }

    .card .subtitle {
      font-size: 0.95rem;
      color: #718096;
      font-weight: 500;
      margin-bottom: 0.1rem;
    }

    .card .date {
      font-size: 0.85rem;
      color: #a0aec0;
      font-style: italic;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.95rem;
      color: #4a5568;
      margin-bottom: 0.4rem;
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 0.5rem;
    }

    ul li {
      position: relative;
      padding-left: 1.2rem;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
      color: #4a5568;
    }

    ul li::before {
      content: "•";
      color: #3182ce;
      font-weight: bold;
      position: absolute;
      left: 0;
    }

    #skills ul li::before {
      content: "▸";
    }

    #contacts ul {
      list-style: none;
    }

    #contacts ul li::before {
      content: "→";
    }

    a {
      color: #3182ce;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      border-top: 1px solid #e2e8f0;
      margin-top: 2rem;
      color: #a0aec0;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem;
      }

      .page-title {
        font-size: 1.6rem;
      }

      header {
        padding: 2rem 0 1.5rem;
      }

      .card {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="page-title">{{TITLE}}</h1>
      {{SUBTITLE}}
      {{RESUME_LINK}}
    </header>

    {{BODY}}
  </div>
</body>
</html>
